name: Build and Deploy to staging
run-name: Deploy to staging (Initiated by ${{ github.actor }})
on:
  push:
    branches:
      - deploy/staging
jobs:
  deployment:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build Assets
        uses: ./.github/actions/build
        with:
          theme-path: ${{ vars.THEME_PATH }}
          target-0branch: "actions/deployment-staging"
      - name: Push to Cloudways
        run: |
          ls
          echo "Test Push"
