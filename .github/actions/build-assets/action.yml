name: Build and optimize assets
inputs:
  theme-path:
    required: true
    type: string
  target-branch:
    required: true
    type: string
runs:
  defaults:
    run:
      shell: bash
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - run: git config --global user.email "git@invisibleink.asia"
    - run: git config --global user.name "Invisible Ink Git Bot"
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: "${{ inputs.theme-path}}/package-lock.json"
    - name: Compile assets
      working-directory: ${{ inputs.theme-path }}
      run: |
        npm install
        npm run build
    - name: Install PHP Dependencies
      uses: php-actions/composer@v6
      with:
        dev: no
        args: --optimize-autoloader
        php_version: 8.2
        version: 2
        working_dir: ${{ inputs.theme-path }}
    - name: Add build artifact
      working-directory: ${{ inputs.theme-path }}
      run: |
        git branch ${{ inputs.taget-branch }}
        git checkout ${{ inputs.taget-branch }}
        git add --force ./vendor
        git add --force ./public
        git commit -m 'Build artifacts'
        git push --force --set-upstream origin ${{ inputs.taget-branch }}
