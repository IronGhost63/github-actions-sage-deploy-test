name: Cloudways git deployment
inputs:
  target-branch:
    required: true
    type: string
  api-key:
    required: true
    type: string
  server-id:
    required: true
    type: string
  application-id:
    required: true
    type: string
runs:
  using: composite
  steps:
    - name: Debug
      shell: bash
      run: |
        echo "API Key: ${{ inputs.api-key }}"
        echo "App ID: ${{ inputs.application-id }}"
        echo "Server ID: ${{ inputs.server-id }}"
